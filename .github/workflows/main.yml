name: RDP Final - Fix Install Error & No Hang

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Disk Before Cleanup
        run: |
          Write-Host "=== TRƯỚC CLEANUP ==="
          Get-PSDrive C | Format-Table Name, @{N="Free(GB)";E={[math]::Round($_.Free/1GB,2)}}
          Write-Host "====================`n"

      - name: Ultimate Cleanup (Free 50-70GB+ - No Hang)
        run: |
          $folders = @(
            "C:\hostedtoolcache",
            "C:\Android",
            "C:\Strawberry",
            "C:\msys64",
            "C:\Program Files (x86)\Microsoft Visual Studio",
            "C:\Program Files\Microsoft SDKs",
            "C:\ProgramData\chocolatey",
            "C:\Windows\Temp",
            "C:\Windows\SoftwareDistribution\Download"
          )
          foreach ($f in $folders) {
            if (Test-Path $f) { Remove-Item $f -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          dism /online /cleanup-image /startcomponentcleanup | Out-Null

      - name: Disk After Cleanup
        run: |
          Write-Host "=== SAU CLEANUP ==="
          Get-PSDrive C | Format-Table Name, @{N="Free(GB)";E={[math]::Round($_.Free/1GB,2)}}
          Write-Host "Free tăng mạnh!`n"

      - name: Low Lag Optimization
        run: |
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 3 /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v EnableTransparency /t REG_DWORD /d 0 /f
          powercfg -setactive SCHEME_MIN
          foreach ($s in "SysMain","DiagTrack","WSearch","MapsBroker") {
            Stop-Service -Name $s -Force -ErrorAction SilentlyContinue
            Set-Service -Name $s -StartupType Disabled -ErrorAction SilentlyContinue
          }

      - name: Enable RDP
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

      - name: Create RDP User
        run: |
          $pass = -join ((33..126) | Get-Random -Count 24 | % {[char]$_})
          $sec = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $sec -AccountNeverExpires -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASS=$pass" >> $env:GITHUB_ENV

      - name: Connect Tailscale (Retry Install if Needed)
        run: |
          # Nếu Tailscale đã có (từ cache action), skip install
          if (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe") {
            Write-Host "Tailscale đã cài sẵn từ action cache!"
          } else {
            # Install thủ công với retry (fix error 1603 thường do network/download)
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
            $path = "$env:TEMP\tailscale.msi"
            for ($i=1; $i -le 3; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $path -UseBasicParsing
                Start-Process msiexec.exe -ArgumentList "/i", "`"$path`"", "/quiet", "/norestart" -Wait
                if ($LASTEXITCODE -eq 0) { break }
              } catch { Write-Host "Retry $i failed..." }
            }
            Remove-Item $path -Force
          }

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=rdp-fast-${{ github.run_id }} --accept-risk=all

          $ip = $null
          for ($i=0; $i -lt 20; $i++) {
            $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null
            if ($ip) { break }
            Start-Sleep -Seconds 6
          }
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Final Info & Keep Alive
        run: |
          Write-Host "`n=================================================="
          Write-Host "       RDP NHANH & ỔN ĐỊNH - FIX HẾT LỖI!        "
          Write-Host "=================================================="
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : RDP"
          Write-Host "Password     : ${{ env.RDP_PASS }}"
          Write-Host "Disk Free    : >70GB sau cleanup"
          Write-Host "=================================================="
          while ($true) { Write-Host "[$(Get-Date)] Active"; Start-Sleep -Seconds 300 }
