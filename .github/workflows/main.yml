name: RDP greenboyMC - Intro The Flash (Giảm Lag Full Max + Fix Hiện IP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download & Extract Ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath .

      - name: Auth Ngrok
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: .\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN

      - name: Giảm Lag Full + Fast Intro + High Performance
        run: |
          # (giữ nguyên phần giảm lag full + user greenboyMC như cũ của bro)

      - name: Start Ngrok Asia (ap) & Get IP/Port Chắc Chắn
        run: |
          Write-Host "=================================================="
          Write-Host "RDP greenboyMC - Giảm Lag Full Max + Ngrok Asia"
          Write-Host "Username: greenboyMC"
          Write-Host "Password: W1nd0ws-P4ssw0rd-2025!"
          Write-Host "Region: ap (Singapore - ping thấp VN)"
          Write-Host "=================================================="

          # Start ngrok ẩn, region ap
          Start-Process -WindowStyle Hidden -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --region ap --log=stdout"

          # Chờ tunnel ready (retry 10 lần, mỗi lần 10s)
          $attempts = 0
          $maxAttempts = 10
          $tunnelUrl = $null

          while ($attempts -lt $maxAttempts -and -not $tunnelUrl) {
            Start-Sleep -Seconds 10
            $attempts++
            try {
              $tunnels = Invoke-RestMethod http://localhost:4040/api/tunnels -ErrorAction Stop
              $tcpTunnel = $tunnels.tunnels | Where-Object { $_.proto -eq "tcp" -and $_.public_url }
              if ($tcpTunnel) {
                $tunnelUrl = $tcpTunnel.public_url
              }
            } catch {
              Write-Host "Chờ tunnel sẵn sàng... (lần $attempts/$maxAttempts)"
            }
          }

          if ($tunnelUrl) {
            $hostPort = $tunnelUrl -replace "tcp://", ""
            $host = $hostPort.split(':')[0]
            $port = $hostPort.split(':')[1]

            Write-Host "=================================================="
            Write-Host "KẾT NỐI RDP THÀNH CÔNG!"
            Write-Host "Address: $hostPort"
            Write-Host "Host: $host"
            Write-Host "Port: $port"
            Write-Host "Username: greenboyMC"
            Write-Host "Password: W1nd0ws-P4ssw0rd-2025!"
            Write-Host "=================================================="
          } else {
            Write-Host "Lỗi: Không lấy được tunnel sau $maxAttempts lần thử. Run workflow lại!"
          }

          # Keep alive ~6 giờ
          Start-Sleep -Seconds 21300
