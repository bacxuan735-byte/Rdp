name: Windows RDP
on:
  workflow_dispatch:
concurrency:
  group: vps-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4

    - name: Install Software
      shell: cmd
      run: choco install googlechrome 7zip -y --no-progress --ignore-checksums

    - name: Set Password
      shell: pwsh
      run: |
        # Đặt mật khẩu cố định với ký tự đặc biệt !
        $pw = ConvertTo-SecureString "vuducthangdepzaidayantacohihi!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $pw

    - name: Enable RDP
      shell: pwsh
      run: |
        Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Setup Ngrok
      shell: pwsh
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -Force
        
        # Sử dụng Secret NGROK_AUTH_TOKEN (bắt buộc phải có)
        .\ngrok\ngrok.exe config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
        
        # Sử dụng Secret NGROK_REGION (ví dụ: ap, us, eu, ...)
        Start-Process .\ngrok\ngrok.exe -ArgumentList "tcp","--region","${{ secrets.NGROK_REGION }}","3389" -WindowStyle Hidden
        
        Write-Host "Waiting for Ngrok tunnel..."
        $url = ""
        for ($i = 0; $i -lt 30; $i++) {
          try {
            $t = Invoke-RestMethod http://localhost:4040/api/tunnels
            if ($t.tunnels.Count -gt 0) { 
              $url = $t.tunnels[0].public_url -replace 'tcp://','' 
              break 
            }
          } catch {}
          Start-Sleep 2
        }

        if ($url) {
          "$url|vuducthangdepzaidayantacohihi!" | Out-File info.txt -NoNewline
          
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "THÔNG TIN KẾT NỐI RDP:" -ForegroundColor Cyan
          Write-Host "Host (Ngrok): $url" -ForegroundColor Yellow
          Write-Host "Username: runneradmin" -ForegroundColor Yellow
          Write-Host "Password: vuducthangdepzaidayantacohihi!" -ForegroundColor Yellow
          Write-Host "Port: 3389 (mặc định RDP)" -ForegroundColor Yellow
          Write-Host "Thời gian hoạt động: 6 giờ" -ForegroundColor Yellow
          Write-Host "==========================================" -ForegroundColor Green
        }
        else { 
          Write-Host "LỖI: Không tìm thấy tunnel Ngrok!" -ForegroundColor Red
          "ERROR|Ngrok tunnel not found" | Out-File info.txt -NoNewline 
        }

    - uses: actions/upload-artifact@v4
      with:
        name: result
        path: info.txt

    - name: Keep Alive
      shell: pwsh
      run: |
        Write-Host "RDP đang chạy trong 360 phút (6 giờ)..."
        Start-Sleep (360 * 60)
