name: MacOS VNC Ngrok

on: [push, workflow_dispatch]

jobs:
  macos-vnc:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
    - name: Download Ngrok
      run: |
        curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-amd64.zip -o ngrok.zip
        unzip ngrok.zip

    - name: Auth Ngrok
      run: ./ngrok authtoken $NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable VNC Server
      run: |
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users admin -privs -all -restart -agent

    - name: Set VNC Password (dễ nhớ)
      run: |
        sudo defaults write /Library/Preferences/com.apple.VNCSettings LocalPassword "mac12345"
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent

    - name: Show Info Connect
      run: |
        echo "=================================="
        echo "MACOS VNC SẴN SÀNG!"
        echo "Password: mac12345"
        echo "Chờ ngrok hiện tcp://0.tcp.ngrok.io:xxxxx"
        echo "Connect bằng RealVNC Viewer hoặc TigerVNC"
        echo "Address: host:port từ log ngrok"
        echo "=================================="

    - name: Create Tunnel VNC Port 5900
      run: ./ngrok tcp 5900 --log=stdout

    - name: Keep Alive
      run: tail -f /dev/null
