      - name: Lấy Tailscale IP (có retry thông minh)
        id: get_ip
        run: |
          Write-Host "Đang chờ Tailscale khởi động hoàn tất..."
          Start-Sleep -Seconds 20

          $maxRetries = 25
          $retryDelay = 12
          $attempt = 1
          $ip = $null

          while ($attempt -le $maxRetries -and -not $ip) {
              $ip = tailscale ip -4 2>$null
              if ($ip) {
                  Write-Host "Thành công: Đã lấy được Tailscale IP -> $ip"
                  break
              }
              Write-Host "Lần thử $attempt/$maxRetries: Chưa có IP, chờ $retryDelay giây..."
              Start-Sleep -Seconds $retryDelay
              $attempt++
          }

          if (-not $ip) {
              Write-Host "::warning::Không lấy được Tailscale IP sau $maxRetries lần thử (bug thường gặp trên Windows runner)."
              Write-Host "::warning::Bạn vẫn có thể connect RDP bình thường và chạy lệnh 'tailscale ip' bên trong máy."
              $ip = "Chưa lấy được (chạy 'tailscale ip' sau khi RDP vào)"
          }

          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          echo "ip=$ip" >> $env:GITHUB_OUTPUT

      - name: Đặt Wallpaper Greenboy
        run: |
          $url = "https://img.pconline.com.cn/images/upload/upc/tx/wallpaper/1305/16/c2/21234567_1368776789333.jpg"
          $wallpaperPath = "$env:USERPROFILE\Pictures\greenboy-wallpaper.jpg"
          
          Write-Host "Đang tải wallpaper xanh chill cổ điển..."
          Invoke-WebRequest -Uri $url -OutFile $wallpaperPath -TimeoutSec 300
          
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value 10
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name TileWallpaper -Value 0
          
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class Wallpaper {
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
          }
"@ 
          [Wallpaper]::SystemParametersInfo(20, 0, $wallpaperPath, 3)
          
          Write-Host "Wallpaper xanh chill cổ điển đã được đặt thành công! 💚☁️"

      - name: Thông Tin Kết Nối Cuối Cùng
        run: |
          $ip = "${{ steps.get_ip.outputs.ip }}"

          Write-Host ""
          Write-Host "========================================="
          Write-Host "       GREENBOY CLOUD PC SẴN SÀNG"
          Write-Host "========================================="
          Write-Host "Tailscale IP : $ip"
          Write-Host "${{ env.RDP_CREDS }}"
          Write-Host "Wallpaper    : Hình đồng cỏ xanh cổ điển đã đặt"
          Write-Host "Cấu hình     : 4 vCPU | 16 GB RAM | ~150 GB ổ trống"
          Write-Host "Kết nối      : Dùng bất kỳ RDP client nào qua Tailscale"
          if ($ip -like "*Chưa lấy được*") {
              Write-Host "Lưu ý        : Phát hiện IP bị chậm (bug phổ biến)."
              Write-Host "              Vẫn connect RDP bình thường → mở CMD → gõ 'tailscale ip'"
          }
          Write-Host "========================================="
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date)] Runner đang chạy - Cancel workflow để tắt"
              Start-Sleep -Seconds 300
          }
